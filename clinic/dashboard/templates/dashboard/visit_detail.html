{% extends "base.html" %}
{% block content %}
    
    
   <div class="block-patient">
        <h2>{{visit.patient.last_name}} {{visit.date}} {{visit.time}}</h2>
        <p><b>visit type:</b> <span>{{visit.treatment.name}}</span></p>
        <p><b>doctor:</b> <span>{{visit.doctor.last_name}}</span></p>
        <p><b>time:</b> <span>{{visit.time}}</span></p>
        <p><b>date</b> <span>{{visit.date}}</span></p>
        <p><b>ambulatory:</b> <span>{{visit.ambulatory}}</span></p>
        <div>
            <a class="btn" href="{% url 'visits'%}">back</a>
        <a class="btn" href="{% url 'reservation_update' visit.id %}">Modify</a>
        <a class="btn-del" href="{% url 'reservation_delete' visit.id %}" onclick="return confirm('Are you sure you want to delete this reservation?');">Cancel</a>
        </div>
    </div>
{% endblock %}
